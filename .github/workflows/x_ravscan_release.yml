name: x-ravscan-build

on:
  push:
    branches:
      - "main"
      - "devin/**"
    paths:
      - "tools/X-RavScan/**"
      - ".github/workflows/x_ravscan_release.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "tools/X-RavScan/**"
      - ".github/workflows/x_ravscan_release.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: tools/X-RavScan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build with PyInstaller (one-folder)
        run: python -m PyInstaller --noconfirm --clean packaging/x_ravscan.spec

      - name: Build with PyInstaller (one-file)
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name X-RavScan `
            --add-data "x_ravscan/data/seed_providers.json;x_ravscan/data" `
            --add-data "x_ravscan/data/ranges;x_ravscan/data/ranges" `
            --add-data "x_ravscan/data/resellers.txt;x_ravscan/data" `
            --hidden-import customtkinter `
            --hidden-import matplotlib.backends.backend_tkagg `
            --hidden-import PIL.ImageTk `
            --distpath dist/onefile `
            --workpath build/work-onefile `
            main.py

      - name: Stage release tree
        run: |
          $stage = "release/X-RavScan"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse -Force dist/X-RavScan/* $stage/
          Copy-Item -Force dist/onefile/X-RavScan.exe release/X-RavScan-onefile.exe
          Copy-Item -Force README.md $stage/README.md
          Copy-Item -Force requirements.txt $stage/requirements.txt
          Get-ChildItem $stage | Select-Object Name, Length | Format-Table -AutoSize

      - name: Create ZIP archive
        run: |
          Compress-Archive -Path release/X-RavScan/* `
                           -DestinationPath release/X-RavScan-windows.zip `
                           -Force
          Get-Item release/X-RavScan-windows.zip | Select-Object Name, Length

      - name: Upload one-folder build
        uses: actions/upload-artifact@v4
        with:
          name: X-RavScan-windows-folder
          path: tools/X-RavScan/release/X-RavScan/**
          retention-days: 30

      - name: Upload zipped build
        uses: actions/upload-artifact@v4
        with:
          name: X-RavScan-windows-zip
          path: tools/X-RavScan/release/X-RavScan-windows.zip
          retention-days: 30

      - name: Upload one-file build
        uses: actions/upload-artifact@v4
        with:
          name: X-RavScan-windows-onefile
          path: tools/X-RavScan/release/X-RavScan-onefile.exe
          retention-days: 30
