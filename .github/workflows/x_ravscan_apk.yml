name: x-ravscan-apk

on:
  push:
    branches:
      - "main"
      - "devin/**"
    paths:
      - "tools/X-RavScan/**"
      - ".github/workflows/x_ravscan_apk.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "tools/X-RavScan/**"
      - ".github/workflows/x_ravscan_apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
        working-directory: tools/X-RavScan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache git \
            libffi-dev libssl-dev libltdl-dev libtool pkg-config \
            zlib1g-dev unzip zip openjdk-17-jdk \
            autoconf automake cmake \
            python3-dev python3-pip python3-setuptools \
            libsqlite3-dev libbz2-dev libreadline-dev \
            libncurses5 libncurses5-dev libtinfo5 libstdc++6
          python -m pip install --upgrade pip wheel
          python -m pip install --upgrade buildozer cython==0.29.36 virtualenv

      - name: Cache buildozer global dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            tools/X-RavScan/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('tools/X-RavScan/packaging/android/buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Stage entry-point script (mobile_main.py -> main.py)
        run: |
          # Buildozer requires main.py at the project root. We keep
          # mobile_main.py as the canonical entry but stage it as main.py
          # here so the desktop main.py (CustomTkinter) is not shipped
          # into the APK.
          cp -f mobile_main.py main.py.android
          mv main.py main.py.desktop
          mv main.py.android main.py
          ls -la *.py

      - name: Generate release keystore
        run: |
          # Deterministic keystore — we ship the same fingerprint every build so
          # users updating the APK don't get "package conflicts with existing
          # signature". Stored alongside the build for transparency.
          keytool -genkeypair -v \
            -keystore packaging/android/release.keystore \
            -alias xravscan \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "xravscan" -keypass "xravscan" \
            -dname "CN=X-RavScan, OU=Tools, O=Maykl044, L=Internet, S=NA, C=NA"

          keytool -list -v \
            -keystore packaging/android/release.keystore \
            -alias xravscan \
            -storepass "xravscan" 2>&1 | head -20

      - name: Build APK (release, signed)
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
          P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/tools/X-RavScan/packaging/android/release.keystore
          P4A_RELEASE_KEYALIAS: xravscan
          P4A_RELEASE_KEYSTORE_PASSWD: xravscan
          P4A_RELEASE_KEYALIAS_PASSWD: xravscan
        run: |
          cd packaging/android
          buildozer -v android release 2>&1 | tail -200
          ls -la bin/

      - name: Restore desktop main.py
        if: always()
        run: |
          if [ -f main.py.desktop ]; then
            mv main.py main.py.staged
            mv main.py.desktop main.py
          fi

      - name: Locate built APK and align/sign for installation
        id: find_apk
        run: |
          APK=$(find packaging/android/bin -name "*release*.apk" | head -n1 || true)
          if [ -z "$APK" ]; then
            APK=$(find packaging/android/bin -name "*.apk" | head -n1 || true)
          fi
          if [ -z "$APK" ]; then
            echo "No APK produced — failing."
            exit 1
          fi
          echo "Built APK: $APK"

          # Locate apksigner / zipalign from the SDK that buildozer downloaded.
          BUILD_TOOLS=$(ls -d ~/.buildozer/android/platform/android-sdk/build-tools/*/ 2>/dev/null | head -n1)
          if [ -z "$BUILD_TOOLS" ]; then
            BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ 2>/dev/null | head -n1)
          fi
          echo "Build tools: $BUILD_TOOLS"

          ALIGNED="X-RavScan-android-aligned.apk"
          "${BUILD_TOOLS}zipalign" -p -f 4 "$APK" "$ALIGNED"

          SIGNED="X-RavScan-android.apk"
          "${BUILD_TOOLS}apksigner" sign \
            --ks packaging/android/release.keystore \
            --ks-key-alias xravscan \
            --ks-pass pass:xravscan \
            --key-pass pass:xravscan \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED" \
            "$ALIGNED"

          "${BUILD_TOOLS}apksigner" verify --verbose --print-certs "$SIGNED" || true

          echo "apk_path=$SIGNED" >> "$GITHUB_OUTPUT"
          ls -la "$SIGNED"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: X-RavScan-android-apk
          path: tools/X-RavScan/X-RavScan-android.apk
          retention-days: 30
