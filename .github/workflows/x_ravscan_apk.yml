name: x-ravscan-apk

on:
  push:
    branches:
      - "main"
      - "devin/**"
    paths:
      - "tools/X-RavScan/**"
      - ".github/workflows/x_ravscan_apk.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "tools/X-RavScan/**"
      - ".github/workflows/x_ravscan_apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
        working-directory: tools/X-RavScan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache git \
            libffi-dev libssl-dev libltdl-dev libtool pkg-config \
            zlib1g-dev unzip zip openjdk-17-jdk \
            autoconf automake cmake \
            python3-dev python3-pip python3-setuptools \
            libsqlite3-dev libbz2-dev libreadline-dev \
            libncurses5 libncurses5-dev libtinfo5 libstdc++6
          python -m pip install --upgrade pip wheel
          python -m pip install --upgrade buildozer cython==0.29.36 virtualenv

      - name: Cache buildozer global dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            tools/X-RavScan/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('tools/X-RavScan/packaging/android/buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Stage entry-point script (mobile_main.py -> main.py)
        run: |
          # Buildozer requires main.py at the project root. We keep
          # mobile_main.py as the canonical entry but stage it as main.py
          # here so the desktop main.py (CustomTkinter) is not shipped
          # into the APK.
          cp -f mobile_main.py main.py.android
          mv main.py main.py.desktop
          mv main.py.android main.py
          ls -la *.py

      - name: Build APK (debug)
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          cd packaging/android
          buildozer -v android debug 2>&1 | tail -200
          ls -la bin/

      - name: Restore desktop main.py
        if: always()
        run: |
          if [ -f main.py.desktop ]; then
            mv main.py main.py.staged
            mv main.py.desktop main.py
          fi

      - name: Locate built APK
        id: find_apk
        run: |
          APK=$(find packaging/android/bin -name "*.apk" | head -n1 || true)
          if [ -z "$APK" ]; then
            echo "No APK produced — failing."
            exit 1
          fi
          echo "Built APK: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          cp "$APK" "X-RavScan-android.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: X-RavScan-android-apk
          path: tools/X-RavScan/X-RavScan-android.apk
          retention-days: 30
