[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x-ravscan"
version = "1.0.0"
description = "Professional CDN / cloud TLS:443 reconnaissance desktop app"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mihail Oganan" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
]
dependencies = [
    "customtkinter>=5.2.0",
    "matplotlib>=3.7",
    "requests>=2.31",
    "cryptography>=41.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
    "nuitka>=2.1",
]

[project.scripts]
x-ravscan = "x_ravscan.cli:main"

[tool.setuptools]
packages = ["x_ravscan", "x_ravscan.core", "x_ravscan.ui", "x_ravscan.utils"]
include-package-data = true

[tool.setuptools.package-data]
x_ravscan = ["data/*.json", "data/ranges/*.txt"]
